name: Build signed Mochi APK

# This workflow only builds an artifact. It does not create a GitHub release or tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    # Do not expose signing secrets to arbitrary feature branches or pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          MOCHI_KEYSTORE_BASE64: ${{ secrets.MOCHI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MOCHI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOCHI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOCHI_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$MOCHI_KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo 'Mochi signing secrets are missing; see SIGNING.md.' >&2
            exit 1
          }
          umask 077
          mkdir -p app/keystore
          printf '%s' "$MOCHI_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
      - name: Build universal release APK
        env:
          STORE_PASSWORD: ${{ secrets.MOCHI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOCHI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOCHI_KEY_PASSWORD }}
        run: ./gradlew assembleUniversalFossRelease --no-configuration-cache --console=plain
      - name: Verify APK signature
        run: |
          set -eu
          APK=$(find app/build/outputs/apk/universalFoss/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: mochi-universal-release-apk
          path: app/build/outputs/apk/universalFoss/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing key
        if: always()
        run: rm -f app/keystore/release.keystore
